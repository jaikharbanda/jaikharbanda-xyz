name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync copy from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN_JAIKHARBANDA_PERSONAL_WEBSITE }}
        run: node scripts/sync-notion.mjs
      - uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub switches off the daily schedule of a public repo after 60 days without a commit.
  # That froze this site on 19 Sep 2026. Re-enabling the workflow through the API on every
  # run restarts that clock, so the daily rebuild keeps going between code changes.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the daily rebuild switched on
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/enable"
